name: Build rootless deb
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Verify iOS SDK
        run: |
          ls -la "$HOME/theos/sdks"
          test -n "$(find "$HOME/theos/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"
      - name: Build package
        run: make clean package FINALPACKAGE=1
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayDSP-rootless
          path: packages/*.deb

name: Build DuoDash Fullscreen Adapter

on:
  workflow_dispatch:
  push:
    branches: [duodash-fullscreen-adapter]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test adapter app lifetime
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -framework Foundation \
            duodash-fullscreen/tests/app-lifetime.m -o "$RUNNER_TEMP/app-lifetime"
          "$RUNNER_TEMP/app-lifetime"
      - name: Install Theos and SDK
        run: |
          brew install ldid xz dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          test -n "$(find "$HOME/theos/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"
      - name: Build
        run: make -C duodash-fullscreen clean package FINALPACKAGE=1
      - name: Verify package
        run: |
          set -e
          ls -lh duodash-fullscreen/packages/*.deb
          dpkg-deb -I duodash-fullscreen/packages/*.deb
          dpkg-deb -c duodash-fullscreen/packages/*.deb
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: DuoDash-Fullscreen-Adapter
          path: duodash-fullscreen/packages/*.deb

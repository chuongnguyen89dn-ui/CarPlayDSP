<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CarPlay Split UI Harness</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;min-height:100vh}.cp{position:relative;width:427px;height:240px;background:#050505;overflow:hidden;border-radius:3px}.dock{position:absolute;left:0;top:0;width:45px;height:100%;background:#171717;display:flex;flex-direction:column;align-items:center;gap:13px;padding-top:15px;transition:.2s}.dock i{width:27px;height:27px;border-radius:7px;background:#555}.work{position:absolute;left:45px;right:0;top:0;bottom:0;display:flex;transition:.2s}.pane{overflow:hidden;position:relative}.left{width:52%;background:linear-gradient(145deg,#24322c,#0d1713)}.right{flex:1;background:linear-gradient(145deg,#301313,#090909)}.map{position:absolute;inset:0;background:repeating-linear-gradient(25deg,transparent 0 22px,#ffffff10 23px 24px)}.video{position:absolute;inset:0;display:grid;place-items:center;font-size:32px}.divider{width:7px;background:#111;position:relative;cursor:ew-resize;flex:0 0 7px}.handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:15px;height:34px;border-radius:10px;background:#2b2b2b;display:grid;place-items:center;font-weight:bold;font-size:12px}.expanded .dock{transform:translateX(-45px)}.expanded .work{left:0}.label{position:absolute;top:5px;left:7px;font-size:9px;opacity:.75}</style><div id="cp" class="cp"><div class="dock"><i></i><i></i><i></i><i></i></div><div class="work"><div id="left" class="pane left"><span class="label">LIVE PANE A</span><div class="map"></div></div><div id="divider" class="divider"><div class="handle">•••</div></div><div class="pane right"><span class="label">LIVE PANE B</span><div class="video">▶</div></div></div></div><script>const cp=document.querySelector('#cp'),d=document.querySelector('#divider'),l=document.querySelector('#left');let drag=false;d.onpointerdown=e=>{drag=true;d.setPointerCapture(e.pointerId)};d.onpointermove=e=>{if(!drag)return;let r=cp.getBoundingClientRect(),dock=cp.classList.contains('expanded')?0:45,w=r.width-dock-7,p=Math.max(.12,Math.min(.88,(e.clientX-r.left-dock)/w));l.style.width=(p*100)+'%'};d.onpointerup=()=>drag=false;let y=0;d.addEventListener('pointerdown',e=>y=e.clientY);d.addEventListener('pointerup',e=>{if(Math.abs(e.clientY-y)>28)cp.classList.toggle('expanded')});</script>
